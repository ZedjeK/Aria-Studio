[package]
name = "aria-coeur"
description = "Le contrat des applis Aria : identité, dossier de données, réglages, journal, sauvegardes, secrets, démarrage automatique, icône, installation, mises à jour."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# La clé de llama-server, tirée à chaque lancement (déjà dans l'arbre par Tauri : aucune crate de plus).
getrandom = "0.4.3"
# Images des créations (retouche, agrandissement, références, vision du LLM), comme Pillow en v2 : PNG, JPEG et
# WebP seulement, en Rust pur, sans rayon. png 0.18 est déjà dans l'arbre par Tauri.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# NVML, la bibliothèque du pilote NVIDIA, chargée à l'exécution : carte, pilote et VRAM (garde VRAM).
nvml-wrapper = "0.13.0"
# Le filtre AS-18 : ses motifs (déjà dans l'arbre par Tauri).
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
# Les données d'Aria Studio sont en YAML commenté (catalogue\, workflows\, securite\, casting\) : lecteur en Rust pur,
# sans libyaml (serde_yaml n'est plus maintenu). Épinglé sur 2.1.1 par Cargo.lock.
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Les processus (ligne de commande, dossier courant) : retrouver un ComfyUI resté seul ; la RAM du PC.
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
# Le WebSocket de ComfyUI, sur ws://127.0.0.1 seulement : sans TLS.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# Le filtre AS-18 : décomposition Unicode (NFKD) avant comparaison, comme la v2 (unicode-rs, sans dépendance).
unicode-normalization = "0.1.26"
# HTTP vers les moteurs, sur 127.0.0.1 seulement : sans TLS ni proxy (la même version que l'appli).
ureq = { version = "3.5.2", default-features = false }
# Le zip des mises à jour : décompression deflate seule, en Rust (sans C à compiler).
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
