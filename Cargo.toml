# Espace de travail Rust d'Aria Studio : le cœur (coeur\, testable partout) et l'appli Windows (appli\).
#
# La version de l'appli vit ici, dans [workspace.package], et nulle part ailleurs : tools\version.ps1 la lit, Tauri
# la reprend pour l'exe, et le tag vX.Y.Z doit lui correspondre.
[workspace]
members = ["coeur", "appli"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
# Pas de code « unsafe » hors des appels à Windows, qui l'autorisent un par un, avec la raison écrite.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Une erreur se traite ou remonte : jamais un plantage silencieux hors des tests (clippy.toml les autorise là).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
# Un exe petit et rapide : tout optimisé ensemble, sans symboles de débogage.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
