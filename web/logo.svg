<g fill="#030812" opacity="0.6"><rect x="68" y="104" width="24" height="1.8" rx="0.9"/><rect x="68" y="109" width="16" height="1.8" rx="0.9"/><rect x="68" y="114" width="20" height="1.8" rx="0.9"/></g>
</g>
</g></svg>
