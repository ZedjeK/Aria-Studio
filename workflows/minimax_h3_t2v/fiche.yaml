        valeur: simple
        source: https://docs.comfy.org/tutorials/video/minimax/minimax-h3
        note: Scheduler du template officiel ComfyUI
    notes:
    - Entraîné vers 1 MP (768 px de petit côté), 24 i/s, 5 à 15 s ; au-delà, qualité non garantie.
    - 'Sur RTX 4080 (2026-10-20) : 0,4 MP / 8 steps ≈ 1 min 20 pour 5 s ; ~1 MP / 12 steps ≈ 7 min pour 5 s.'
conseils_prompt:
    sources:
    - https://docs.comfy.org/tutorials/video/minimax/minimax-h3
    - https://www.atlascloud.ai/blog/tips/minimax-h3-prompt-guide
    regles:
    - 'Un court brief de production : sujet, action, décor, caméra, son.'
    - Un seul mouvement de caméra, nommé précisément, avec sa vitesse (slow push-in, slow pan…).
    - 'Répliques courtes : qui parle, la phrase entre guillemets, la langue et le ton ; 1 à 2 phrases par plan.'
    - Sons concrets liés à l'action ; la musique de fond à part, jamais mélangée aux bruitages.
    - 'Scènes complexes : chronologie par segments ([0s-2s], [2s-4s]).'
    - Éviter les consignes contradictoires (plan continu ET coupes).
