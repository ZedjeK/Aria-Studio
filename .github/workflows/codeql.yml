# CodeQL : GitHub relit le code à chaque changement et signale les failles connues.
# Le langage « actions » relit les workflows eux-mêmes ; la stack ajoute le sien.
name: CodeQL

# refonte/v3 (branche d'intégration de la version 3) est relue comme main : le ruleset exige CodeQL sur les deux.
on:
  pull_request:
    branches: [main, refonte/v3]
  push:
    branches: [main, refonte/v3]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # Rust et TypeScript relus sans compiler.
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
