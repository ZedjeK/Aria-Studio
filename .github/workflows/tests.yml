# Suite de tests à chaque push et pull request, sur Windows avec le Python du projet (3.11).
# Ni GPU, ni ComfyUI, ni llama-server, ni modèle : tools/tester.py lance les tests dans un dossier utilisateur jetable
# où les fichiers des workflows sont posés vides et modeles/llm reste vide ; NVML, ComfyUI et Llama sont simulés dans
# les tests qui en parlent (sans carte NVIDIA, les tests passent aussi). Le coffre Windows de test_cles est celui du
# runner, sous un nom d'essai effacé à la fin.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python tools/tester.py
