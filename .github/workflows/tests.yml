# Tests : sur chaque PR vers main ou refonte/v3, et sur chaque push sur ces deux branches.
# refonte/v3 est la branche d'intégration de la version 3 (Rust, Tauri, Svelte) : le même ruleset la protège.
#
# Aucun filtre de chemins (paths, paths-ignore) : un workflow ignoré laisserait le check « tests » en attente et
# bloquerait toute PR, puisque le ruleset de main l'exige.
name: Tests

on:
  pull_request:
    branches: [main, refonte/v3]
  push:
    branches: [main, refonte/v3]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Seulement sur les PR : deux fusions rapprochées n'annulent pas le run de main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  tests: # ce nom est celui que le ruleset exige : ne jamais le renommer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Rust (la version de rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Seule main enregistre le cache ; les PR et les tags le lisent sans pouvoir le remplacer.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests
        run: ./tools/tester.ps1

      # Les scripts .ps1 doivent aussi tourner sous Windows PowerShell 5.1, celui livré avec Windows.
      # Même job : le check exigé par le ruleset garde son nom « tests ».
      - name: Tests sous Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/tester.ps1
