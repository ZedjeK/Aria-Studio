[package]
name = "aria-appli"
description = "L'appli Windows : fenêtre Tauri, interface Svelte, appels à Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Interface embarquée dans l'exe (build.ps1 l'active) ; sans elle, la fenêtre charge le serveur de développement.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
aria-coeur = { path = "../coeur" }
serde = { version = "1.0.229", features = ["derive"] }
# Les fiches des créations, telles que la v2 les écrit (déjà dans l'arbre par le cœur).
serde_json = "1.0.154"
# tray-icon : l'icône de notification des applis qui servent en arrière-plan.
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
# Les mises à jour : HTTPS par SChannel, avec les certificats et le proxy de Windows.
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "win-system-proxy"] }

[target.'cfg(windows)'.dependencies]
# Le sélecteur de dossier natif (dossier des modèles, « J'ai déjà ComfyUI ») : IFileDialog de Windows, sans greffon.
rfd = { version = "0.18.0", default-features = false }
windows = { version = "0.62.2", features = [
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
