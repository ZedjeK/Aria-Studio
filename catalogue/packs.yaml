# Packs de l'assistant de premier lancement (app/assistant.py) : ce que l'utilisateur coche selon ce qu'il veut faire.
# Les fichiers, tailles, SHA-256 et licences viennent des fiches (workflows/*/fiche.yaml, catalogue/llm.yaml) :
# rien n'est recopié ici. Krea 2 n'y est pas (accès restreint sur Hugging Face, licence pas encore lue).
#
# workflows / llm : ce que le pack installe ; moteurs : ceux dont il a besoin (catalogue/moteurs.yaml)
# favoris : réglés à la fin, packs pris dans l'ordre du fichier (un pack plus bas l'emporte) et seulement si ce
#           qu'ils désignent est installé
# testee : la seule carte sur laquelle le pack a été essayé (le banc de palier n'a pas encore fixé de minimum)

format: 1

packs:
    images:
        nom: Images
        usage: Créer des images depuis une idée, ou depuis des références (personnage, style)
        workflows: [qwen_image_2_1, qwen_image_2_1_edit]
        moteurs: [comfyui]
        conseille: true
        testee: RTX 4080 SUPER 16 Go
        favoris:
            generation:
                texte_vers_image: qwen_image_2_1
                references: qwen_image_2_1_edit
                retouche: qwen_image_2_1_edit

    video:
        nom: Vidéo
        usage: Animer une image, tourner un clip depuis une idée, monter des séquences avec voix (MiniMax H3)
        workflows: [minimax_h3_i2v, minimax_h3_t2v]
        moteurs: [comfyui]
        testee: RTX 4080 SUPER 16 Go
        favoris:
            generation:
                image_vers_video: minimax_h3_i2v
                texte_vers_video: minimax_h3_t2v

    llm:
        nom: Réécriture des prompts
        usage: Un LLM local (Bonsai 2 27B, compressé en ternaire) transforme ton idée en français en prompt détaillé pour le modèle
        llm: [Ternary-Bonsai-2-27B-PTQ1_0.gguf]
        # Le moteur officiel reste nécessaire : l'appli le cherche pour son état (pastille Llama) et les LLM spécialisés
        # de Qwen-Image 2.1 le lancent ; Bonsai 2, lui, tourne sur le fork PrismML.
        moteurs: [llama, llama-prism]
        conseille: true
        testee: RTX 4080 SUPER 16 Go
        favoris:
            llama:
                modele: Ternary-Bonsai-2-27B-PTQ1_0.gguf
