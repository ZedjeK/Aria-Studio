# listés ; pour tout le reste (découpage, peaufinage, traduction), Aria passe au LLM par défaut. Le filtre AS-18
# contrôle leur prompt comme celui de n'importe quel LLM. Fiches relevées le 2026-11-02 (API Hugging Face).
# GGUF : conversions communautaires (prithivMLmods) des modèles officiels de Qwen ; le SHA-256 vérifie le fichier,
# pas sa fidélité à l'original (à juger au Casting).

